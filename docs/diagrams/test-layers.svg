<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" preserveAspectRatio="xMidYMid meet" version="1.1" viewBox="0 0 480 565" zoomAndPan="magnify" width="480" height="565"><?plantuml $version$?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="Verdana" font-size="22" font-weight="700" lengthAdjust="spacing" textLength="448.8895" x="15" y="38.5181">Test layers (bottom = most tests, fastest)</text></g><!--entity L4--><g class="entity" data-qualified-name="L4" data-source-line="4" id="ent0001"><rect fill="#FFFFFF" height="77.2038" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="304.5769" x="87.1555" y="62.9641"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="174.1173" x="97.1555" y="87.93">Integration over real HTTP</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="284.5769" x="97.1555" y="106.998">integration.test.ts &#8212; full Mode-A roundtrip,</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="232.5671" x="97.1555" y="126.0659">ephemeral port, seeded demo data</text></g><!--entity L3--><g class="entity" data-qualified-name="L3" data-source-line="5" id="ent0002"><rect fill="#FFFFFF" height="77.2038" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1;" width="282.149" x="98.3655" y="200.1641"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="179.5913" x="108.3655" y="225.13">HTTP app-level (no sockets)</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="189.2513" x="108.3655" y="244.198">security / rate-limit / static &#8212;</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="262.149" x="108.3655" y="263.2659">Hono app.request() against the real app</