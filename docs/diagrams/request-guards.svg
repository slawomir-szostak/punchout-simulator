th:1;" rx="12.5" ry="12.5"/><text x="388.384" y="322.807" fill="#000" font-size="12" textLength="171.432" font-family="Verdana">Over the request-rate limit?  →</text><text x="562.936" y="322.807" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">429</text><rect x="357.516" y="371.323" width="256.88" height="36.344" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="367.516" y="394.151" fill="#000" font-size="12" textLength="213.168" font-family="Verdana">A write while over the disk budget?  →</text><text x="583.804" y="394.151" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">507</text><rect x="359.424" y="498.122" width="253.064" height="36.344" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="369.424" y="520.95" fill="#000" font-size="12" textLength="209.352" font-family="Verdana">Client over the wrong-secret limit?  →</text><text x="581.896" y="520.95" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">429</text><polygon points="423.543,442.667,548.37,442.667,560.37,457.649,548.37,472.631,423.543,472.631,411.543,457.649,423.543,442.667" fill="#FFF" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="489.956" y="484.39" fill="#000" font-size="11" textLength="17.083" font-family="Verdana">yes</text><text x="423.543" y="454.426" fill="#000" font-size="11" textLength="102.189" font-family="Verdana">POST /sim/:id/order</text><text x="423.543" y="469.408" fill="#000" font-size="11" textLength="124.827" font-family="Verdana">and the tool is exposed?</text><text x="560.37" y="454.426" fill="#000" font-size="11" textLength="13.453" font-family="Verdana">no</text><polygon points="485.956,559.957,497.956,571.957,485.956,583.957,473.956,571.957,485.956,559.957" fill="#FFF" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="376.692" y="61