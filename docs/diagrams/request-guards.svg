="#000" font-size="14" textLength="89.152" font-family="Verdana">Control plane</text><rect x="49.316" y="299.979" width="198.284" height="52.688" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="59.316" y="322.807" fill="#000" font-size="12" textLength="157.861" font-family="Verdana">Host header is not loopback</text><text x="59.316" y="339.151" fill="#000" font-size="12" textLength="154.572" font-family="Verdana">or the public URL's host?  →</text><text x="217.008" y="339.151" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">403</text><rect x="32.035" y="387.667" width="232.846" height="52.688" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="42.035" y="410.495" fill="#000" font-size="12" textLength="212.846" font-family="Verdana">State-changing and marked cross-site</text><text x="42.035" y="426.84" fill="#000" font-size="12" textLength="152.856" font-family="Verdana">(Sec-Fetch-Site / Origin)?  →</text><text x="198.011" y="426.84" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">403</text><rect x="23" y="530.81" width="250.916" height="36.344" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="33" y="553.638" fill="#000" font-size="12" textLength="207.204" font-family="Verdana">Client over the wrong-token limit?  →</text><text x="243.324" y="553.638" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">429</text><rect x="47.726" y="602.154" width="201.464" height="36.344" fill="#FFF" style="stroke:#000;stroke-width:1;" rx="12.5" ry="12.5"/><text x="57.726" y="624.983" fill="#000" font-size="12" textLength="157.752" font-family="Verdana">Token missing or wrong?  →</text><text x="218.598" y="624.983" fill="#000" font-size="12" textLength="20.592" font-weight="700" font-family="Verdana">401</text><polygon points="96.429,475.356,200.488,475.356,212.488,490.338,200.488,505.319