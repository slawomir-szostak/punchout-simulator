name: Publish to npm

# Publishes on a GitHub Release. Auto-generates provenance via GitHub OIDC,
# cryptographically linking the package to this public repo (spec section 2).
# Registry auth uses the NPM_TOKEN repository secret (see the job comment).

on:
  release:
    types: [published]
  # Manual only: runs the oidc-check diagnostic below, never a publish.
  workflow_dispatch:

# Authenticates with an npm automation/granular token stored as the NPM_TOKEN
# repository secret. Provenance is still generated via GitHub OIDC (id-token).
# (Trusted publishing / tokenless OIDC is the nicer long-term setup, but it
# requires a correctly-matched trusted-publisher entry on npmjs.com; token auth
# is used here because it is reliable and unambiguous.)
jobs:
  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance attestation
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Diagnostic for npm trusted publishing (it failed with ENEEDAUTH on v0.11.0).
  # Performs the same OIDC → npm token exchange `npm publish` does, but only
  # reports the outcome: the returned token is masked and discarded, nothing is
  # published. It must live in publish.yml — the file npm's trusted publisher
  # names. Run with: gh workflow run publish.yml
  oidc-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Where npm exchanges the token
        run: |
          npm --version
          grep -rn "oidc/token/exchange" "$(npm root -g)/npm/lib" || echo "npm has no OIDC exchange code"
      - name: Exchange the GitHub OIDC token with npm
        run: |
          set -euo pipefail
          id_token=$(curl -sfS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          # The claims npm matches the trusted publisher against (not secret).
          payload=$(cut -d. -f2 <<<"$id_token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq '{aud, repository, repository_owner, workflow_ref, job_workflow_ref, event_name, ref, environment}'
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/punchout-simulator")
          token=$(jq -r '.token // empty' resp.json 2>/dev/null || true)
          [ -n "$token" ] && echo "::add-mask::$token"
          echo "HTTP $status"
          jq 'if .token then .token = "<received, discarded>" else . end' resp.json 2>/dev/null || cat resp.json
          rm -f resp.json
