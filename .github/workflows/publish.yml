name: Publish to npm

# Publishes on a GitHub Release via npm trusted publishing: npm exchanges the
# job's GitHub OIDC token for a short-lived publish credential, so there is no
# stored npm token. The trusted publisher (this repo + publish.yml) is
# registered on npmjs.com; provenance is generated automatically (spec section 2).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: trusted-publishing auth + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm >= 11.5.1, newer than some Node 24 bundles.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
