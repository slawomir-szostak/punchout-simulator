name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new advisory surfaces even when nothing is being pushed.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24] # 20 = declared minimum (package.json engines)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The bundle carries every runtime package: it must load on this Node as built.
      - run: node dist/server/cli.js --version
      - run: npm test

  # Fails on any moderate+ advisory in the packages that ship to users. The
  # published package has no dependencies — they are built into the server
  # bundle — so the audit is narrowed to exactly what the build inlined (dev
  # tooling never reaches the published package). Its own job, so a new advisory
  # doesn't mask the build/test result.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - run: npm run audit:bundled

  # The image is not published anywhere; this only keeps the Dockerfile building.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t punchout-simulator .
