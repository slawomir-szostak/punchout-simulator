name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new advisory surfaces even when nothing is being pushed.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24] # 20 = declared minimum (package.json engines)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Fails on any moderate+ advisory in the dependencies that ship to users
  # (dev tooling is excluded: it never reaches the published package). Its own
  # job, so a new advisory doesn't mask the build/test result.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=moderate

  # The image is not published anywhere; this only keeps the Dockerfile building.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t punchout-simulator .
